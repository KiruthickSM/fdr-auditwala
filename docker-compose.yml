version: "3.9"

services:
  # Lite & Full Profile Shared Core Services
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fdrguard_postgres
    environment:
      POSTGRES_USER: fdr_admin
      POSTGRES_PASSWORD: fdr_secure_password
      POSTGRES_DB: fdr_auditwala
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles: ["lite", "full"]

  redis:
    image: redis:7-alpine
    container_name: fdrguard_redis
    ports:
      - "6379:6379"
    profiles: ["lite", "full"]

  minio:
    image: minio/minio:latest
    container_name: fdrguard_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    profiles: ["lite", "full"]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: fdrguard_api
    environment:
      DATABASE_URL: postgresql://fdr_admin:fdr_secure_password@postgres:5432/fdr_auditwala
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      RUN_PROFILE: 
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    profiles: ["lite", "full"]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: fdrguard_web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - api
    profiles: ["lite", "full"]

  # Full Profile Observability & Distributed Orchestration
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fdrguard_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'fdrguard-kafka-cluster-01'
    ports:
      - "9092:9092"
    profiles: ["full"]

  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: fdrguard_temporal
    environment:
      - DB=postgresql
      - POSTGRES_USER=fdr_admin
      - POSTGRES_PWD=fdr_secure_password
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"
      - "8233:8233"
    depends_on:
      - postgres
    profiles: ["full"]

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: fdrguard_prometheus
    ports:
      - "9090:9090"
    profiles: ["full"]

  grafana:
    image: grafana/grafana:10.2.2
    container_name: fdrguard_grafana
    ports:
      - "3001:3000"
    profiles: ["full"]

volumes:
  postgres_data:
  minio_data:
