apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdrguard-api
  labels:
    app: fdrguard-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fdrguard-api
  template:
    metadata:
      labels:
        app: fdrguard-api
    spec:
      containers:
      - name: api
        image: aicte/fdrguard-api:v1.0.0
        ports:
        - containerPort: 8000
        env:
        - name: RUN_PROFILE
          value: "lite"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fdrguard-api-svc
spec:
  selector:
    app: fdrguard-api
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdrguard-web
  labels:
    app: fdrguard-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fdrguard-web
  template:
    metadata:
      labels:
        app: fdrguard-web
    spec:
      containers:
      - name: web
        image: aicte/fdrguard-web:v1.0.0
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://fdrguard-api-svc:8000"
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fdrguard-web-svc
spec:
  type: LoadBalancer
  selector:
    app: fdrguard-web
  ports:
  - port: 80
    targetPort: 3000
